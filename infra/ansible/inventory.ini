# OpsLoop 내부망 (네트워크 설계 · infra/vmware/README.md)
# Mac(관리망 192.168.70.1)은 방화벽(192.168.70.254)으로만 들어간다. 안쪽 노드는 방화벽을 거쳐 접속한다.
# ~/.ssh/config.opsloop 와 같은 경로 · 사용자 · 키다. ssh -F 는 경로의 ~ 를 풀지 않고, 주소로 접속하면
# config 의 Host 별칭이 맞지 않으므로 여기서는 ProxyCommand 로 적는다 (ProxyCommand 는 셸이 돌려 ~ 가 풀린다).
# 호스트 키는 add-node.sh 가 주소로 known_hosts 에 넣어 두었다.

[firewall]
fw ansible_host=192.168.70.254

[targets]
web01 ansible_host=192.168.50.21 node_id=web-01 node_addr=192.168.50.21

[data]
data01 ansible_host=192.168.60.11

[consoles]
console-a ansible_host=192.168.50.11
# 콘솔 B 는 평소 꺼 둔다. 끄기 전에 consoles.yml 로 가드를 심어 두고, 켜서 서비스에 넣기 전에 다시 돌린다
console-b ansible_host=192.168.50.12

[internal:children]
targets
data
consoles

[all:vars]
ansible_user=ops
ansible_ssh_private_key_file=~/.ssh/opsloop_ed25519
ansible_python_interpreter=/usr/bin/python3

[firewall:vars]
ansible_ssh_common_args='-o IdentitiesOnly=yes'

[internal:vars]
ansible_ssh_common_args='-o IdentitiesOnly=yes -o ProxyCommand="ssh -q -W %h:%p -i ~/.ssh/opsloop_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes ops@192.168.70.254"'
