# 콘솔 A·B 호스트 가드 (이슈 #11 · 설계 6장)
#
# web-01 이 같은 서비스망에서 콘솔의 8000 · 22 에 직접 닿지 못하게 한다. HAProxy(방화벽 192.168.50.1)만 통과한다.
# 전용 oneshot 단위(opsloop-guard.service)가 /etc/opsloop/console-guard.nft 로 inet console_guard 표 하나만 건다.
# 기본 nftables.service 는 멈출 때 flush ruleset 으로 docker 규칙까지 지우므로 쓰지 않는다.
#
#   ansible-playbook consoles.yml
#
# 콘솔 B 는 평소 꺼 둔다. 끄기 전에 이 플레이북을 돌려 가드를 심어 두면, 장애로 다시 켤 때 부팅과 함께 가드가 걸린다.
# 이미 꺼져 있으면 --limit console-a 로 돌리고, 켜서 서비스에 넣기 전에 --limit console-b 로 한 번 더 돌린다.
# 두 번째 실행은 changed=0 이다.

- name: 콘솔 호스트 가드
  hosts: consoles
  become: true
  gather_facts: false

  handlers:
    - name: 가드 다시 걸기
      ansible.builtin.systemd_service:
        name: opsloop-guard.service
        state: restarted
        daemon_reload: true

  tasks:
    # 이미 있으면 권한을 건드리지 않는다 (콘솔 비밀값 파일이 있을 수 있다)
    - name: 설정 폴더
      ansible.builtin.file:
        path: /etc/opsloop
        state: directory

    - name: 가드 규칙 (적용 전 문법 검사)
      ansible.builtin.copy:
        src: console-guard.nft
        dest: /etc/opsloop/console-guard.nft
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/nft -c -f %s
      notify: 가드 다시 걸기

    - name: 가드 단위
      ansible.builtin.copy:
        src: opsloop-guard.service
        dest: /etc/systemd/system/opsloop-guard.service
        owner: root
        group: root
        mode: "0644"
      notify: 가드 다시 걸기

    - name: 가드 켜기 (부팅 때도)
      ansible.builtin.systemd_service:
        name: opsloop-guard.service
        enabled: true
        state: started
        daemon_reload: true

    - name: 바뀐 가드 적용
      ansible.builtin.meta: flush_handlers

    - name: 가드 확인
      ansible.builtin.command:
        argv: [/usr/sbin/nft, list, chain, inet, console_guard, pre]
      register: guard
      changed_when: false
      failed_when: guard.rc != 0 or 'ip saddr 192.168.50.0/24 drop' not in guard.stdout
