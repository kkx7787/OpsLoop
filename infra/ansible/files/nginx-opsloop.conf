# OpsLoop web-01 nginx (Ansible 이 /etc/nginx/conf.d/opsloop.conf 로 둔다)
#
# 패키지 기본 사이트(sites-enabled/default)를 대신해 80 의 default_server 를 맡는다 (플레이북이 기본 사이트 링크를 지운다).
# 접근 기록은 JSON 한 줄(opsloop.json)로만 남긴다. Alloy 가 job=nginx 로 보내고 다리가 nginx.request 로 옮긴다.
#   - 모든 값은 문자열이다 (escape=json). 형식은 구현 계약 6장과 한 글자도 다르지 않아야 한다.
#   - rid($request_id)가 있어 같은 모양의 요청도 줄이 겹치지 않는다 (line_hash = sha1(원문 줄)).
#   - host 는 $hostname(opsloop-web-01). 다리는 nodes.hostname 과 다르면 foreign_host 로 버린다.
log_format opsloop escape=json '{"ts":"$msec","rid":"$request_id","host":"$hostname","src_ip":"$remote_addr","src_port":"$remote_port","dst_port":"$server_port","method":"$request_method","uri":"$request_uri","status":"$status","bytes":"$body_bytes_sent","ua":"$http_user_agent","rt":"$request_time"}';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/opsloop.json opsloop;

    root /var/www/html;
    index index.html index.nginx-debian.html;

    # 첫 수신 확인 탐침 (web01.yml → nodes.py check). 본문 없이 204 만 준다
    location ^~ /opsloop-first-receipt/ {
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
