# OpsLoop web-01 Alloy 제한 (Ansible 이 /etc/systemd/system/alloy.service.d/opsloop.conf 로 둔다)
#
# 768MB 노드에서 상주 150MB 를 목표로 256MB 에서 끊는다 (설계 2장 · 10단계 메모리 관문).
# Alloy 는 이 한도의 90% 를 GOMEMLIMIT 로 스스로 잡는다 (automemlimit). 따로 적지 않는다.
# 실행 인자(--disable-reporting)는 /etc/default/alloy 의 CUSTOM_ARGS 에 둔다.
[Service]
MemoryMax=256M
# 로그를 읽어 관문으로 보내기만 한다. 쓰는 곳은 저장 폴더(/var/lib/alloy, 읽은 위치 파일) 하나다.
# 공격자가 만든 줄을 읽는 구성 요소이므로 권한을 좁힌다.
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/alloy
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
CapabilityBoundingSet=
