# OpsLoop web-01 rsyslog (Ansible 이 /etc/rsyslog.d/00-opsloop.conf 로 둔다)
#
# 반복 축약을 끈다. 켜져 있으면 같은 줄이 "message repeated N times: [ ... ]" 한 줄로 합쳐져
# SSH 실패가 적게 세진다 (설계 11장). 다리는 이런 줄을 repeated 로 세고, 첫 수신 3단계가 0 인지 본다.
# rsyslog 8 에서 이 값은 설정 전체에 하나이고 마지막으로 읽은 값이 이긴다.
# rsyslog.conf 의 "on" 은 rsyslog.d 를 읽기 전에 있으므로 여기서 끄면 된다.
$RepeatedMsgReduction off

# 파일 기록 형식을 RFC3339 µs 시각으로 고정한다 (Ubuntu 24.04 기본과 같다).
# 이 파일 뒤에 읽히는 50-default.conf 의 auth.log 에 적용된다. 파서가 이 머리를 기대한다.
$ActionFileDefaultTemplate RSYSLOG_FileFormat
