# OpsLoop 내부망 구성 (Mac 이 제어 노드). 이 폴더에서 돌린다: cd infra/ansible && ansible-playbook web01.yml
[defaults]
inventory = inventory.ini
interpreter_python = /usr/bin/python3
retry_files_enabled = False
callback_result_format = yaml
forks = 5
# 방화벽을 한 번 거치므로 기본 10초보다 넉넉히 둔다
timeout = 20

[ssh_connection]
# 모듈을 표준 입력으로 넘긴다. 빠르고, 모듈 인자(등록 토큰 등)가 원격 디스크에 파일로 남지 않는다
pipelining = True
# 첫 수신 확인은 최대 10분 걸린다. 그동안 연결이 끊기지 않게 살아 있음을 주고받는다
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=4
