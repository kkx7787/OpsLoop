# 관제 콘솔 (opsloop-console-a · b · 서비스망)
#   상태를 갖지 않는다. 공유 상태는 데이터 노드의 PostgreSQL 에 둔다 (기획안 5.3).
#   두 대가 같은 SESSION_SECRET 을 가져야 한 쪽으로 넘어가도 로그인이 풀리지 않는다.
services:
  api:
    build: ./app
    container_name: opsloop-api
    restart: always
    environment:
      # 콘솔 역할(판정 · 조치 · 차단 · 등록 토큰 · 감사만). 비밀번호는 infra/vmware/scripts/db-console-role.sh 가 .env 에 넣는다
      DATABASE_URL: postgresql://opsloop_console:${OPSLOOP_CONSOLE_DB_PASSWORD:?OPSLOOP_CONSOLE_DB_PASSWORD 필요 (db-console-role.sh)}@192.168.60.11:5432/opsloop
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 필요}
      # 알림 본문의 콘솔 링크 기준 주소 (이슈 #33). 관리망에서 여는 주소다.
      OPSLOOP_CONSOLE_URL: ${OPSLOOP_CONSOLE_URL:-http://192.168.70.254:8443}
      # 알림 발송기의 콘솔 이름. VM 마다 다르게 둔다(opsloop-console-a · opsloop-console-b).
      #   비우면 컨테이너 hostname 을 쓰는데, 컨테이너를 다시 만들 때마다 바뀌어 재기동 때 보내던 알림을 곧바로 되찾지 못한다.
      OPSLOOP_WORKER: ${OPSLOOP_WORKER:-}
      # 로그인 기록의 출발지 (이슈 #43). uvicorn 은 이 주소에서 온 요청의 X-Forwarded-For 만 믿고 맨 오른쪽 값을 쓴다.
      #   HAProxy(방화벽의 서비스망 주소)가 클라이언트가 보낸 값을 지우고 자기가 본 주소 하나만 싣는다 (haproxy/haproxy.cfg).
      #   호스트 가드(infra/ansible/files/console-guard.nft)가 서비스망에서 이 주소만 8000 에 들인다.
      #   * 나 대역으로 넓히지 않는다. 넓히면 그 주소에서 온 요청이 출발지를 마음대로 적는다
      FORWARDED_ALLOW_IPS: ${OPSLOOP_TRUSTED_PROXY:-192.168.50.1}
      TZ: UTC
    ports:
      # HAProxy(방화벽 VM)가 이 포트로 헬스체크하고 트래픽을 보낸다.
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
    # 콘솔 로그(CSP 위반 보고 줄 포함, 이슈 #41)가 디스크를 채우지 않게 돌려 쓴다. 10 MB × 3개
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
