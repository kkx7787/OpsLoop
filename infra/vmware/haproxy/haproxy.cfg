# 콘솔 A · B 분배. 능동 헬스체크로 전환 시간의 상한을 설계 단계에서 정한다.
#   검사 주기 2초 × 연속 실패 3회 = 최대 6초 안에 장애 노드를 제외한다 (ADR-9)
global
    # chroot 안에서는 /dev/log 가 /var/lib/haproxy/dev/log 다. haproxy.service 의 BindReadOnlyPaths 가 그 자리에 호스트의
    #   /dev/log(journald)를 붙여 두므로 지금처럼 journald → rsyslog 49-haproxy.conf → /var/log/haproxy.log 로 간다
    log /dev/log local0
    maxconn 2000
    # 작업 프로세스는 root 를 버리고 haproxy 사용자로 chroot 안에서 돈다 (이슈 #43). master 는 root 로 남아 reload 를 받는다.
    #   fw 확인(2026-09-25 · 읽기): haproxy 사용자 · 그룹 · /var/lib/haproxy · /var/lib/haproxy/dev/log 가 있다 (패키지 기본).
    #   haproxy 프로세스의 mountinfo 에 /run/systemd/journal/dev-log → /var/lib/haproxy/dev/log 바인드가 있다. 단위에 권한 제한 · AppArmor 없음
    #   작업 프로세스가 기동 뒤 여는 파일은 없다 (인증서 · 맵 · 오류 페이지 없음, 서버는 주소로 적는다)
    user haproxy
    group haproxy
    chroot /var/lib/haproxy

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # 웹소켓은 오래 연결을 유지한다
    timeout tunnel  1h

frontend console
    # 모든 인터페이스에서 받되, 실제로 들어올 수 있는 곳은 내부 방화벽이 정한다
    # (관리망 · VPN 만 8443 허용). VPN 주소는 부팅 순서에 따라 늦게 생기므로 주소를 고정하지 않는다.
    bind :8443
    # 로그인 기록의 출발지 (이슈 #43). 클라이언트가 보낸 X-Forwarded-For 는 지우고 HAProxy 가 본 주소 하나만 싣는다.
    #   콘솔 uvicorn 은 FORWARDED_ALLOW_IPS(192.168.50.1, compose/console.yml)에서 온 요청의 이 헤더만 믿는다.
    #   if-none 을 붙이지 않는다. 붙이면 클라이언트가 보낸 값이 그대로 남는다
    #   X-Forwarded-Proto 도 지운다. 앱은 scheme 을 쓰지 않지만 uvicorn 이 믿는 주소의 값으로 scheme 을 바꾸므로 남기지 않는다
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Proto
    option forwardfor
    default_backend consoles

backend consoles
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # inter 2s · fall 3 → 장애 인지 최대 6초
    # rise 3 · slowstart 30s → 복구 노드는 연속 3회 정상 뒤 가중치를 서서히 올린다 (플래핑 방지)
    default-server inter 2s fall 3 rise 3 slowstart 30s
    server console-a 192.168.50.11:8000 check
    server console-b 192.168.50.12:8000 check

# 통계 페이지는 인증이 없고 서버 주소 · 상태를 보인다. 방화벽 VM 안에서만 연다 (이슈 #41).
#   관리망 · VPN 에서는 SSH 터널로 본다: ssh -F ~/.ssh/config.opsloop -L 8404:127.0.0.1:8404 fw
#   → http://127.0.0.1:8404 (infra/vmware/README.md '접근 경로')
listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /
    stats refresh 5s
