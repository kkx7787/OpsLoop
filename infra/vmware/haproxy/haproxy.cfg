# 콘솔 A · B 분배. 능동 헬스체크로 전환 시간의 상한을 설계 단계에서 정한다.
#   검사 주기 2초 × 연속 실패 3회 = 최대 6초 안에 장애 노드를 제외한다 (ADR-9)
global
    log /dev/log local0
    maxconn 2000

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # 웹소켓은 오래 연결을 유지한다
    timeout tunnel  1h

frontend console
    bind 192.168.70.254:8443
    bind 192.168.50.1:8443
    default_backend consoles

backend consoles
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # inter 2s · fall 3 → 장애 인지 최대 6초
    # rise 3 · slowstart 30s → 복구 노드는 연속 3회 정상 뒤 가중치를 서서히 올린다 (플래핑 방지)
    default-server inter 2s fall 3 rise 3 slowstart 30s
    server console-a 192.168.50.11:8000 check
    server console-b 192.168.50.12:8000 check

listen stats
    bind 192.168.70.254:8404
    stats enable
    stats uri /
    stats refresh 5s
