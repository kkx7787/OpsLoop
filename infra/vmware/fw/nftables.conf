#!/usr/sbin/nft -f
# 내부 방화벽 (opsloop-fw). 네트워크 설계 3.2 규칙표를 그대로 옮긴 것이다.
# 규칙표에 없는 통신은 전부 거부하고 기록한다.
# 사람이 요청한 차단(콘솔 · 판정 도구)은 집합 opsloop_block 에 들어와 forward 에서 막는다 (이슈 #51. 관문과 같은 목록 · 같은 꼴).
# 외부 역할 세그먼트(ext · 시연용 공격자 VM)는 관제 대상 web-01 의 웹(80)에만 닿는다.
flush ruleset

define SERVICE = 192.168.50.0/24
define DATA    = 192.168.60.0/24
define MGMT    = 192.168.70.0/24
# 서비스망에는 콘솔과 관제 대상(web-01)이 함께 있다. DB 는 콘솔만 쓴다.
define CONSOLES = { 192.168.50.11, 192.168.50.12 }
define WEB01    = 192.168.50.21
# 등록된 관제 대상의 수집 경로. 임시 규칙만 넣으면 재부팅 뒤 수신이 끊긴다.
define LOG_SENDERS = { 192.168.50.21, 192.168.50.22 }
define DATA01   = 192.168.60.11
# 외부 역할 세그먼트 (이슈 #51). 시연용 공격자 VM 이 여기서 web-01 을 친다. 문서용 대역(RFC 5737)이라 차단 목록에 올릴 수 있다
# (사설 대역은 차단 금지 대역이다). create-networks.sh 의 vmnet5 · netplan/fw.yaml.template 의 ext 와 같은 대역이어야 한다
define EXT      = 203.0.113.0/24
# 수집 관문 (토큰 검사). 관제 대상의 에이전트가 여기로만 보낸다
define INGEST   = 3101

table inet filter {
  # 구성 창. 플레이북이 관제 대상을 구성하는 동안만 인터넷(443)을 열어 준다.
  #   nft add element inet filter provision { 192.168.50.21 timeout 30m }
  # 끝나면 지우고, 지우지 못해도 30분 뒤 저절로 빠진다
  set provision {
    type ipv4_addr
    flags timeout
  }

  # 차단 목록 (이슈 #51). 데이터 노드 집행기가 원장 버킷에 올린 목록을 동기화(opsloop-block-sync, 1분 · nft 모드)가 넣고 뺀다.
  # 관문(infra/aws/gateway/nftables.conf)과 이름 · 꼴이 같아 같은 동기화 스크립트를 쓴다. 원소마다 만료(timeout)가 있어
  # 동기화가 멈춰도 저절로 빠진다. 이 파일을 nft -f 로 다시 읽으면(flush ruleset) 집합이 비지만 동기화가 1분 안에 되살린다
  set opsloop_block {
    type ipv4_addr
    flags timeout
    size 4096
  }

  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif "lo" accept
    ct state invalid drop
    # 관리망(작업자 단말)에서만 방화벽 자신에 접근한다.
    # HAProxy 통계(8404)는 방화벽 안(127.0.0.1)에서만 열고 SSH 터널로 본다 (이슈 #41)
    iifname "mgmt" ip saddr $MGMT tcp dport { 22, 8443 } accept
    iifname "mgmt" ip saddr $MGMT icmp type echo-request accept
    # 내부 노드의 상태 확인용 핑만 허용
    iifname { "service", "data" } icmp type echo-request accept
    # 내부 노드의 시간 동기화(NTP). 방화벽이 시간 서버 역할을 한다
    iifname { "service", "data" } udp dport 123 accept
    # 외부 역할 세그먼트에서는 핑과 시간 동기화만 받는다 (공격자 VM 의 로그 시각을 맞춘다). 22 · 8443 은 열지 않는다 (이슈 #51).
    # 그 밖의 ext 유입은 여기서 끝낸다. 뒤의 랜카드를 보지 않는 허용 줄(Tailscale 41641 등)에 닿지 않게 한다
    iifname "ext" icmp type echo-request accept
    iifname "ext" udp dport 123 accept
    iifname "ext" limit rate 10/minute log prefix "fw-input-drop "
    iifname "ext" drop
    # 관리망 VPN(Tailscale)으로 들어온 접근. 콘솔과 관리 접속만 연다.
    iifname "tailscale0" tcp dport { 22, 8443 } accept
    iifname "tailscale0" icmp type echo-request accept
    iifname != "ext" udp dport 41641 accept
    # limit 가 먼저 와야 한다. log 를 먼저 쓰면 모든 패킷을 기록한 뒤에 limit 를 본다
    limit rate 10/minute log prefix "fw-input-drop "
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop

    # 차단 목록의 출발지는 어디로도 넘기지 않는다 (이슈 #51). 허용 규칙 앞에 둔다. 맺어진 연결은 위 established 로
    # 끝까지 가고 새 연결부터 막힌다. 거부는 fw-block-drop 으로 남겨(초당 10줄) '차단 요청 → 실제 거부'를 보인다
    ip saddr @opsloop_block limit rate 10/second log prefix "fw-block-drop "
    ip saddr @opsloop_block drop
    # 외부 역할 세그먼트 → 관제 대상 web-01 의 웹만 (이슈 #51). 나머지 ext 유입은 바로 끝낸다. 뒤의 출발지만 보는 허용 줄
    # (ip saddr $MGMT accept 등)이 들어온 랜카드를 보지 않으므로, 출발지를 관리망 주소로 꾸민 패킷이 거기에 닿지 않게 한다
    iifname "ext" ip saddr $EXT ip daddr $WEB01 tcp dport 80 accept
    iifname "ext" limit rate 10/minute log prefix "fw-forward-drop "
    iifname "ext" drop

    # 서비스망 → 데이터망 : 콘솔은 DB 만 쓴다.
    # 관제 대상(web-01)은 같은 서비스망에 있어도 DB 에 닿지 않고, 수집 관문으로만 보낸다
    ip saddr $CONSOLES ip daddr $DATA01 tcp dport 5432 accept
    ip saddr $LOG_SENDERS ip daddr $DATA01 tcp dport $INGEST accept
    # 데이터망 → 인터넷 : S3 에서 로그 가져오기 · CTI 원본 받기(KEV · OSV · EPSS · NVD) · S3 cti/ 보관(443)
    ip saddr $DATA oifname "uplink" tcp dport 443 accept
    ip saddr $DATA oifname "uplink" udp dport 53 accept
    # 서비스망 → 인터넷 : 콘솔만 (등록된 통보 채널과 외부 생존 신호 443).
    # 관제 대상은 구성 창에서만 나간다
    ip saddr $CONSOLES oifname "uplink" tcp dport 443 accept
    ip saddr $CONSOLES oifname "uplink" udp dport 53 accept
    ip saddr @provision oifname "uplink" tcp dport 443 accept
    ip saddr @provision oifname "uplink" udp dport 53 accept
    # 관리망 → 전체 : 작업자 단말의 구성 작업
    ip saddr $MGMT accept
    # VPN → 내부 세그먼트 : 관리 접속(SSH)만 연다.
    # 콘솔 화면은 방화벽의 HAProxy(8443)로만 본다. DB 등 다른 포트는 VPN 으로도 닫는다.
    iifname "tailscale0" oifname { "service", "data" } tcp dport 22 accept
    # 데이터 · 서비스 → 관리망 : 거부 (아래 기록 규칙에 걸린다)
    # 인터넷 → 내부 : 정책이 drop 이므로 별도 규칙 없음
    limit rate 10/minute log prefix "fw-forward-drop "
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}

table ip nat {
  chain postrouting {
    type nat hook postrouting priority 100; policy accept;
    oifname "uplink" masquerade
  }
}
