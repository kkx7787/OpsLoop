# 관문 방화벽 거부 기록 (이슈 #15). /etc/rsyslog.d/10-opsloop-gateway.conf 로 둔다.
# nftables 의 log 규칙(접두 gw-)은 커널 메시지로 나온다. 그중 gw- 접두만 골라
# /var/log/opsloop/gateway.log 에 연도가 있는 RFC3339 시각으로 쓴다. 업로더(sensor=gateway)가
# 이 파일을 원장으로 올리고 parser/parse_gateway.py 가 이 줄 모양을 읽는다.
# 기본 시각(Sep 22 01:02:03)은 연도 · 시간대가 없어 쓰지 않는다.
# 50-default.conf 보다 먼저 읽히도록 이름을 10- 으로 두고, 여기서 stop 해 syslog · kern.log 에 겹쳐 쓰지 않는다.

template(name="OpsloopGateway" type="string"
         string="%TIMESTAMP:::date-rfc3339% %HOSTNAME% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

# imklog 로 들어온 것만 본다. journald 가 같은 커널 메시지를 다시 넘겨도 두 번 적지 않는다.
# 파일은 업로더(opsloop-up)가 읽어야 하므로 0644 로 만든다
if $inputname == "imklog" and re_match($msg, "gw-[a-z-]+ IN=") then {
  action(type="omfile" file="/var/log/opsloop/gateway.log" template="OpsloopGateway"
         fileOwner="syslog" fileGroup="adm" fileCreateMode="0644"
         dirOwner="syslog" dirGroup="adm" dirCreateMode="0755" createDirs="on")
  stop
}
