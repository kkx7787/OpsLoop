# 관문 fail2ban 집행 동작 (이슈 #47). /etc/fail2ban/action.d/opsloop-nft.conf 로 둔다.
# 주소를 nftables.conf 의 집합 inet filter opsloop_block 에 넣고 뺀다. 집합과 막는 규칙(forward 체인)은
# nftables.conf 가 만들므로 시작 · 멈춤에서는 아무것도 하지 않는다. 기본 동작 action.d/nftables.conf 는
# 자기 표 · 체인(f2b-table)을 만들고 지우므로 쓰지 않는다.
# 태그: <ip> 는 차단 주소, <bantime> 은 이 차단의 초 단위 정수(jail bantime)다 (1.0.2 server/actions.py ActionInfo 의
# "bantime" · "ip"). 중괄호는 기본 nftables.conf 처럼 \{ \} 로 적는다. 명령은 셸로 돌고 셸이 \{ 를 { 로 바꾼다.
# IPv6 는 넣지 않는다(집합이 ipv4_addr 이고 동기화가 IPv4 만 건다).

[Definition]

actionstart =

actionstop =

# 집합 점검은 동기화가 매 회차 한다(nft -j list set 으로 기대와 대조)
actioncheck =

actionban = nft add element inet filter opsloop_block \{ <ip> timeout <bantime>s \}

# 이미 빠진 원소(만료 · nft -f 로 비워진 뒤)를 빼면 명령이 실패해 fail2ban.log 에 오류가 남지만, 끝 상태(집합에 없음)는 같다
actionunban = nft delete element inet filter opsloop_block \{ <ip> \}

# fail2ban 을 멈출 때 주소마다 actionunban 을 돌리는 대신 한 번에 비운다. 집합 자체는 남는다
actionflush = nft flush set inet filter opsloop_block

[Init]
