# 관문 fail2ban jail (이슈 #47). /etc/fail2ban/jail.d/opsloop-block.conf 로 둔다.
# fail2ban 은 로그를 감시해 스스로 차단하지 않는다. 사람이 요청한 차단 목록을 관문 동기화(block-sync.py)가
# fail2ban-client set opsloop-block banip · unbanip 로 넣고 빼는 집행 도구로만 쓴다.
# 패키지를 설치하기 전에 이 파일을 먼저 둔다. 설치 순간 fail2ban 이 켜지는데 그때 sshd jail 이 켜지지 않게 하려는 것이다.
# 읽는 순서는 jail.conf → jail.d/*.conf(이름순) → jail.local → jail.d/*.local 이다. 이 파일은 패키지의
# defaults-debian.conf(sshd 를 켠다)보다 뒤에 읽혀 그 값을 덮는다.

# 관문은 sshd 를 첫 부팅에 가린다(cloud-init). 감시할 인증 기록이 없고, 켜 두면 기본 ignoreip(127.0.0.1/8)
# 밖의 관리 주소가 몇 번 실패하는 것만으로 막힌다
[sshd]
enabled = false

[opsloop-block]
enabled = true
# 감시할 로그가 없다. filter 를 비우면 1.0.2 는 'No filter set' 경고만 남긴다(client/jailreader.py).
# logpath 는 하나라도 있어야 jail 이 뜬다(없으면 'Have not found any log file' 로 서버 시작이 실패한다).
# 아무도 쓰지 않는 빈 전용 파일을 준다. 설치 절차가 패키지보다 먼저 만든다
filter =
backend = polling
logpath = /var/lib/opsloop-block-sync/fail2ban-empty.log
# 실패를 세지 않으므로 findtime · maxretry 는 쓰지 않는다
action = opsloop-nft
# 동기화가 만료(until)에 unbanip 한다. 동기화가 멈춰도 24시간 안에 풀린다(영구 차단이 생기지 않는다).
# block-sync.py 의 BANTIME 과 같아야 한다(자가 시험이 원소 timeout 으로 확인한다). bantime.increment 는 쓰지 않는다
bantime = 86400
