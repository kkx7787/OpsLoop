# 관문 fail2ban 서버 설정 (이슈 #47). /etc/fail2ban/fail2ban.d/opsloop.conf 로 둔다.
# 차단 기록의 원천은 콘솔 DB(blocklist)이고 fail2ban 은 집행만 한다. 재시작 때 옛 차단을 되살리는 자체 DB 를 끈다.
# 1.0.2 는 dbfile 이 None(대소문자 무관)이면 DB 를 만들지 않는다(server/server.py setDatabase).
# ':memory:' 도 재시작하면 사라지지만 메모리 DB 를 따로 두므로 None 을 쓴다.
# 재시작하면 차단이 비고(멈출 때 actionflush 가 집합도 비운다), 동기화가 다음 회차(1분 안)에 다시 건다.

[Definition]
dbfile = None
