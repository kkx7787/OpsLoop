#!/usr/sbin/nft -f
# 관문 방화벽 (opsloop-gateway). 네트워크 설계 3.1 규칙표를 그대로 옮긴 것이다 (이슈 #15).
# 인터넷 → DMZ 는 DNAT 된 22 · 23 · 8080 만 지나가고, DMZ 에서 나가는 것은 전부 거부하고 기록한다 (이슈 #19).
# 원장(S3)과 SSM 은 VPC 엔드포인트로 가서 방화벽을 지나지 않는다. 규칙표에 없는 통신은 전부 거부하고 기록한다. 기록(gw- 접두)은 rsyslog 가 모아 원장(sensor=gateway)으로 올린다.
# 인터페이스가 한 장뿐이라(공개 서브넷의 ENI 로 들어와 같은 ENI 로 나간다) 이름 대신 주소로 방향을 가른다.
# 사람이 요청한 차단(콘솔 · 판정 도구)은 집합 opsloop_block 에 들어와 허니팟 유입만 막는다 (이슈 #47).
flush ruleset

# 방화벽 자신. 인터넷 게이트웨이가 EIP 를 이 주소로 바꿔 넣는다
define SELF      = 10.0.1.10
define DMZ       = 10.0.21.0/24
# 허니팟 · 웹 디코이 (한 대). honeypot_dmz.tf 의 private_ip 와 같아야 한다
define HONEYPOT  = 10.0.21.10
# 허니팟으로 넘기는 포트
define FORWARDED = { 22, 23, 8080 }

table inet filter {
  # 차단 목록 (이슈 #47). 데이터 노드 집행기가 원장 버킷에 올린 목록을 관문 동기화(opsloop-block-sync, 1분)가
  # 넣고 뺀다(fail2ban jail opsloop-block 또는 nft 직접). 원소마다 만료(timeout)가 있어 동기화가 멈춰도 저절로 빠진다.
  # IPv4 만 둔다. VPC 에 IPv6 대역이 없고(dmz.tf) 보안그룹 유입도 cidr_ipv4 뿐이며 DNAT 도 table ip nat 이라 v6 유입이 없다.
  # 이 파일을 nft -f 로 다시 읽으면(flush ruleset) 집합이 비지만, 동기화가 실제 집합과 목록을 대조해 1분 안에 되살린다
  set opsloop_block {
    type ipv4_addr
    flags timeout
    size 4096
  }

  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif "lo" accept
    # 연결 추적이 받지 않는 패킷(FIN · NULL · XMAS 조사, SYN-ACK · RST 백스캐터, 연결 없는 ICMP 오류)도
    # 두드림이다. 버리기 전에 같은 접두로 기록한다
    ct state invalid limit rate 30/minute log prefix "gw-input-drop "
    ct state invalid drop
    # DHCP 응답은 VPC 라우터(서브넷 .1)에서만 받는다. 첫 임대 · 재바인딩은 원시 소켓이 netfilter 앞에서
    # 받고, 갱신 응답은 established 로 들어온다. 인터넷의 67→68 은 아래 기록으로 떨어진다
    ip saddr 10.0.1.1 udp sport 67 udp dport 68 accept
    # 관리는 SSM(밖으로 여는 연결)뿐이라 유입 포트가 없다(sshd 는 첫 부팅에 끈다).
    # 보안그룹 유입을 전부 열어 두었으므로 인터넷의 포트 조사가 여기까지 와서 기록된다.
    # 22 · 23 · 8080 은 prerouting 에서 DNAT 되어 forward 로 가므로 여기 오지 않는다.
    # limit 가 먼저 와야 한다. log 를 먼저 쓰면 모든 패킷을 기록한 뒤에 limit 를 본다
    limit rate 30/minute log prefix "gw-input-drop "
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    # 기록한 뒤 버린다
    ct state invalid limit rate 20/minute log prefix "gw-forward-drop "
    ct state invalid drop
    # 차단 목록의 출발지는 허니팟으로 넘기지 않는다 (이슈 #47). forward 에만 걸어 DNAT 유입(22 · 23 · 8080)만 막고,
    # 관문 자신의 관리 경로(SSM 은 밖으로 여는 연결 · DHCP)가 지나는 input 체인은 건드리지 않는다.
    # 이미 맺어진 연결은 위 established 에서 끝까지 가고 새 연결부터 막힌다. 거부는 gw-block-drop 으로
    # 남겨(초당 10줄) 원장에서 '차단 요청 → 실제 거부'를 보인다
    ip saddr @opsloop_block limit rate 10/second log prefix "gw-block-drop "
    ip saddr @opsloop_block drop
    # 인터넷 → DMZ : DNAT 로 바뀐 22 · 23 · 8080 만. 그 외는 아래 거부 기록에 걸린다
    ip daddr $HONEYPOT ct status dnat tcp dport $FORWARDED accept
    # DMZ → 밖 : 허용하는 것이 없다. 원장(S3)과 SSM 은 VPC 엔드포인트 경로로 가서 여기를 지나지 않고,
    # 여기까지 온 것은 인터넷 · 내부망 · 다른 VPC 를 향한 시도이므로 전부 거부 · 기록한다.
    # 허니팟 ↔ 디코이는 한 대라 가를 것이 없다
    limit rate 20/minute log prefix "gw-forward-drop "
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}

table ip nat {
  chain prerouting {
    type nat hook prerouting priority -100; policy accept;
    # 공격 유입. 출발지는 그대로 두므로 허니팟 로그에 공격자 주소가 남는다
    ip saddr != $DMZ ip daddr $SELF tcp dport $FORWARDED dnat to $HONEYPOT
  }

  # DMZ 가 나가는 통신이 없으므로 postrouting(masquerade)은 없다. DNAT 의 회신은 연결 추적이 되돌린다
}
