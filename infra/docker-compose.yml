# OpsLoop 앱 노드 (EC2-2)
#   postgres : 운영 데이터. 인시던트·조치·판정은 영구 보존한다.
#   api      : FastAPI. 콘솔이 붙는 지점.
#
# 인터넷에서 들어올 수 있는 포트는 API(8000) 하나뿐이다.
# DB(5432)는 VPC 안에서만 열리며, 보안그룹으로 수집 노드만 허용한다.

services:
  postgres:
    image: postgres:16-alpine
    container_name: opsloop-db
    restart: always
    environment:
      POSTGRES_DB: opsloop
      POSTGRES_USER: opsloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports:
      # VPC 내부에서 수집 노드가 붙는다. 인터넷 노출이 아니며, 접근 통제는
      # 보안그룹에서 한다 (opsloop-honeypot-sg 로부터의 5432 만 허용).
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsloop -d opsloop"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  api:
    build: ../app
    container_name: opsloop-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://opsloop:${POSTGRES_PASSWORD}@postgres:5432/opsloop
      TZ: UTC
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata: